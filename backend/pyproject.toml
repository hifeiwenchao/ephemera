[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemera-backend"
version = "0.1.0"
description = "Backend for a single chat prototype"
requires-python = ">=3.11"
dependencies = [
    "aiomysql>=0.2.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "redis>=5,<7",
    "sanic>=23.12",
    "tortoise-orm>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "fakeredis>=2.25,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "sanic-testing>=23.12",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".."]
